<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Session Restore settings</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --card: #ffffff;
        --fg: #1b1b1f;
        --muted: #62626b;
        --line: #e3e3e8;
        --hover: #f4f4f7;
        --accent: #2f6fd0;
        --accent-fg: #ffffff;
        --ok: #1a7f4b;
        --ok-bg: #eaf7f0;
        --warn-bg: #fff6e5;
        --warn-line: #e8c98a;
        --warn-fg: #6b4a05;
        --shadow: 0 1px 2px rgba(16, 16, 20, .06), 0 8px 24px rgba(16, 16, 20, .05);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1a1a1e;
          --card: #232329;
          --fg: #eeeef2;
          --muted: #9a9aa4;
          --line: #35353c;
          --hover: #2a2a30;
          --accent: #6ea8fe;
          --accent-fg: #10131a;
          --ok: #5fd39b;
          --ok-bg: #16281f;
          --warn-bg: #2f2716;
          --warn-line: #5c4a1f;
          --warn-fg: #e8c98a;
          --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 24px rgba(0, 0, 0, .3);
        }
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 13.5px/1.55 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      header {
        flex: none;
        padding: 20px 24px 14px;
        border-bottom: 1px solid var(--line);
      }
      h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: -.01em; }
      .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }

      main { flex: 1; overflow-y: auto; padding: 4px 24px 20px; }
      main::-webkit-scrollbar { width: 10px; }
      main::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }
      main::-webkit-scrollbar-thumb:hover { background: var(--muted); }

      h2 {
        font-size: 11.5px;
        text-transform: uppercase;
        letter-spacing: .06em;
        color: var(--muted);
        margin: 22px 0 8px;
        font-weight: 600;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .item {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 13px 16px;
        border-bottom: 1px solid var(--line);
      }
      .item:last-child { border-bottom: none; }
      .item .text { flex: 1; min-width: 0; }
      .item .label { font-weight: 500; }
      .item .hint { color: var(--muted); font-size: 12.5px; margin-top: 1px; }

      /* A real switch, because a checkbox does not read as "this is on right now". */
      .switch {
        position: relative;
        flex: none;
        width: 40px;
        height: 22px;
        border-radius: 11px;
        border: none;
        background: var(--line);
        cursor: pointer;
        padding: 0;
        transition: background .22s cubic-bezier(.2, .7, .3, 1);
      }
      .switch::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, .3);
        transition: transform .22s cubic-bezier(.2, .7, .3, 1);
      }
      .switch[aria-checked="true"] { background: var(--accent); }
      .switch[aria-checked="true"]::after { transform: translateX(18px); }

      select, input[type="number"] {
        font: inherit;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 5px 8px;
      }
      input[type="number"] { width: 72px; }

      button.ghost {
        font: inherit;
        font-size: 12.5px;
        padding: 5px 11px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--fg);
        cursor: pointer;
        white-space: nowrap;
      }
      button.ghost:hover { background: var(--hover); }

      .pill {
        font-size: 11.5px;
        padding: 2px 9px;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--muted);
        white-space: nowrap;
      }
      .pill.on {
        color: var(--ok);
        background: var(--ok-bg);
        border-color: transparent;
      }

      /* The panel that appears under the private switch. It animates open so the
         window does not jump, which is the whole point of putting it here. */
      .reveal {
        display: grid;
        grid-template-rows: 0fr;
        transition: grid-template-rows .28s cubic-bezier(.2, .7, .3, 1);
      }
      .reveal.open { grid-template-rows: 1fr; }
      .reveal > .inner { overflow: hidden; }

      .note {
        border: 1px solid var(--warn-line);
        background: var(--warn-bg);
        color: var(--warn-fg);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 12.5px;
        margin: 0 16px 14px;
      }

      .browserrow {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 9px 16px;
      }
      .browserrow .name { flex: 1; font-weight: 500; }
      .dot {
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--line);
      }
      .dot.on { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-bg); }

      footer {
        flex: none;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 24px 16px;
        border-top: 1px solid var(--line);
      }
      footer .meta { flex: 1; color: var(--muted); font-size: 11.5px; }
      button.primary {
        font: inherit;
        padding: 7px 18px;
        border-radius: 7px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: var(--accent-fg);
        font-weight: 500;
        cursor: pointer;
      }
      button.primary:hover { filter: brightness(1.08); }

      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

      /* Content fades up on first paint. Subtle enough to read as "settled" rather
         than as an effect. */
      @media (prefers-reduced-motion: no-preference) {
        .fade { animation: rise .32s cubic-bezier(.2, .7, .3, 1) both; }
        .fade:nth-of-type(2) { animation-delay: .04s; }
        .fade:nth-of-type(3) { animation-delay: .08s; }
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: none; }
      }
      .saved {
        color: var(--ok);
        font-size: 11.5px;
        opacity: 0;
        transition: opacity .2s;
      }
      .saved.show { opacity: 1; }
    </style>
  </head>
  <body>
    <header>
      <h1>Session Restore</h1>
      <div class="sub" id="sub">Loading</div>
    </header>

    <main id="main"></main>

    <footer>
      <div class="meta" id="meta"></div>
      <span class="saved" id="saved">Saved</span>
      <button class="primary" id="done">Done</button>
    </footer>

    <script>
      const send = (msg) => window.ipc.postMessage(JSON.stringify(msg));
      let data = null;

      const esc = (s) =>
        String(s).replace(/[&<>"']/g, (c) =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );

      // "Chrome and Edge and Firefox" is not a sentence anyone writes.
      function listOf(names) {
        if (names.length <= 1) return names[0] || "";
        if (names.length === 2) return `${names[0]} and ${names[1]}`;
        return `${names.slice(0, -1).join(", ")} and ${names[names.length - 1]}`;
      }

      function flashSaved() {
        const el = document.getElementById("saved");
        el.classList.add("show");
        clearTimeout(flashSaved.t);
        flashSaved.t = setTimeout(() => el.classList.remove("show"), 1400);
      }

      function render() {
        if (!data) return;
        document.getElementById("sub").textContent =
          `Watching ${data.tabs_tracked} tab${data.tabs_tracked === 1 ? "" : "s"} ` +
          `in ${data.windows_tracked} window${data.windows_tracked === 1 ? "" : "s"}.`;
        document.getElementById("meta").textContent =
          `Version ${data.agent_version} · ${data.snapshots} saved session${data.snapshots === 1 ? "" : "s"}`;

        // Only browsers that are actually installed. Telling someone to set up Firefox
        // when they do not have Firefox is noise dressed up as guidance.
        const installed = data.browsers.filter((b) => b.installed);

        const main = document.getElementById("main");
        main.innerHTML = `
          <h2 class="fade">When you sign in</h2>
          <div class="card fade">
            <div class="item">
              <div class="text">
                <div class="label">Restoring your session</div>
                <div class="hint" id="modehint"></div>
              </div>
              <select id="mode">
                <option value="ask">Ask me first</option>
                <option value="auto">Restore automatically</option>
                <option value="off">Do not restore</option>
              </select>
            </div>
            <div class="item">
              <div class="text">
                <div class="label">Keep watching my session</div>
                <div class="hint">Turn this off to pause without losing what is already saved.</div>
              </div>
              <button class="switch" id="capture" role="switch"></button>
            </div>
          </div>

          <h2 class="fade">Private and incognito windows</h2>
          <div class="card fade">
            <div class="item">
              <div class="text">
                <div class="label">Remember private windows</div>
                <div class="hint">
                  Encrypted on this computer, never uploaded, and deleted on a timer.
                </div>
              </div>
              <button class="switch" id="private" role="switch"></button>
            </div>
            <div class="reveal" id="privreveal">
              <div class="inner">
                <div class="item">
                  <div class="text">
                    <div class="label">Forget them after</div>
                    <div class="hint">Anything older than this is erased from disk.</div>
                  </div>
                  <input type="number" id="ttl" min="1" max="168" step="1" />
                  <span class="hint">hours</span>
                </div>
                <div id="perm"></div>
              </div>
            </div>
          </div>

          <h2 class="fade">Browsers</h2>
          <div class="card fade" id="browsers">
            ${
              installed.length
                ? installed
                    .map(
                      (b) => `
              <div class="browserrow">
                <span class="dot ${b.connected ? "on" : ""}"></span>
                <span class="name">${esc(b.label)}</span>
                <span class="pill ${b.connected ? "on" : ""}">${
                        b.connected ? "Connected" : "Extension not loaded"
                      }</span>
                <button class="ghost" data-open="${esc(b.id)}">Open</button>
              </div>`,
                    )
                    .join("")
                : `<div class="browserrow"><span class="name">No supported browser found.</span></div>`
            }
          </div>

          <h2 class="fade">Your data</h2>
          <div class="card fade">
            <div class="item">
              <div class="text">
                <div class="label">Everything is stored on this computer</div>
                <div class="hint">${esc(data.data_dir)}</div>
              </div>
              <button class="ghost" id="folder">Open folder</button>
            </div>
          </div>
        `;

        document.getElementById("mode").value = data.restore_mode;
        document.getElementById("modehint").textContent = {
          ask: "You get a list of what was open and choose what comes back.",
          auto: "Everything comes back on its own, with no prompt.",
          off: "Nothing is captured and nothing is restored.",
        }[data.restore_mode];

        setSwitch("capture", data.capture_enabled);
        setSwitch("private", data.capture_private);
        document.getElementById("ttl").value = data.private_ttl_hours;
        document.getElementById("privreveal").classList.toggle("open", data.capture_private);
        renderPermissions(installed);
        wire(installed);
      }

      // The honest part. The switch above is only half of the permission: the browser
      // has to agree too, and until it does, nothing is captured. Saying so here is
      // the difference between a setting and a promise that quietly is not kept.
      function renderPermissions(installed) {
        const el = document.getElementById("perm");
        if (!data.capture_private) {
          el.innerHTML = "";
          return;
        }
        const pending = installed.filter((b) => !b.private_allowed);
        if (!pending.length) {
          el.innerHTML = `<div class="note" style="background:var(--ok-bg);border-color:transparent;color:var(--ok)">
            Every browser has granted access. Private windows are being remembered.
          </div>`;
          return;
        }
        el.innerHTML = `<div class="note">
          <strong>One more step in ${listOf(pending.map((b) => esc(b.label)))}.</strong>
          Your browser has to allow it separately, and until it does, nothing from a
          private window is captured.
          <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
            ${pending
              .map(
                (b) =>
                  `<button class="ghost" data-open="${esc(b.id)}">Set up ${esc(b.label)}</button>`,
              )
              .join("")}
          </div>
          <div style="margin-top:8px;opacity:.85">
            ${pending
              .map((b) => `${esc(b.label)}: ${esc(b.private_hint)}`)
              .join("<br />")}
          </div>
        </div>`;
      }

      function setSwitch(id, on) {
        document.getElementById(id).setAttribute("aria-checked", on ? "true" : "false");
      }

      function wire(installed) {
        document.getElementById("mode").addEventListener("change", (e) => {
          data.restore_mode = e.target.value;
          send({ action: "set_restore_mode", value: e.target.value });
          document.getElementById("modehint").textContent = {
            ask: "You get a list of what was open and choose what comes back.",
            auto: "Everything comes back on its own, with no prompt.",
            off: "Nothing is captured and nothing is restored.",
          }[e.target.value];
          flashSaved();
        });

        document.getElementById("capture").addEventListener("click", () => {
          data.capture_enabled = !data.capture_enabled;
          setSwitch("capture", data.capture_enabled);
          send({ action: "set_capture_enabled", value: data.capture_enabled });
          flashSaved();
        });

        document.getElementById("private").addEventListener("click", () => {
          data.capture_private = !data.capture_private;
          setSwitch("private", data.capture_private);
          document.getElementById("privreveal").classList.toggle("open", data.capture_private);
          renderPermissions(installed);
          send({ action: "set_capture_private", value: data.capture_private });
          flashSaved();
        });

        document.getElementById("ttl").addEventListener("change", (e) => {
          const v = Math.max(1, Math.min(168, parseInt(e.target.value, 10) || 24));
          e.target.value = v;
          data.private_ttl_hours = v;
          send({ action: "set_private_ttl", value: v });
          flashSaved();
        });

        for (const b of document.querySelectorAll("[data-open]")) {
          b.addEventListener("click", () =>
            send({ action: "open_extensions_page", browser: b.dataset.open }),
          );
        }
        document
          .getElementById("folder")
          .addEventListener("click", () => send({ action: "open_data_folder" }));
      }

      window.srSettings = (payload) => {
        data = payload;
        render();
      };

      document.getElementById("done").addEventListener("click", () => send({ action: "close" }));
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") send({ action: "close" });
      });

      send({ action: "ready" });
    </script>
  </body>
</html>
