<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Session Restore</title>
    <style>
      :root { color-scheme: light dark; }
      body { font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
             margin: 0; padding: 16px; min-width: 22rem; max-width: 30rem; }
      h1 { font-size: 1rem; margin: 0 0 .75rem; }
      .row { display: flex; gap: .5rem; align-items: baseline;
             padding: .4rem 0; border-bottom: 1px solid rgba(128,128,128,.2); }
      .row :first-child { flex: 1; opacity: .75; }
      .val { font-variant-numeric: tabular-nums; }
      .ok { color: #157f3b; } .bad { color: #b3261e; }
      details { margin-top: 1rem; font-size: .85rem; }
      ol { padding-left: 1.2rem; }
      p.note { font-size: .78rem; opacity: .7; }
    </style>
  </head>
  <body>
    <h1>Session Restore</h1>
    <div class="row"><span>Agent</span><span class="val" id="agent">checking…</span></div>
    <div class="row"><span>Tabs tracked</span><span class="val" id="tabs">–</span></div>
    <div class="row"><span>Private windows</span><span class="val" id="private">–</span></div>

    <details id="incognito-help">
      <summary>Enable for private windows</summary>
      <p class="note">
        Private tabs are stored encrypted on this computer and deleted automatically.
        They are never uploaded. You can turn this off at any time.
      </p>
      <ol id="steps"></ol>
    </details>

    <script type="module" src="options.js"></script>
  </body>
</html>
