<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Restored tab</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        padding: 24px; box-sizing: border-box;
      }
      main { max-width: 34rem; text-align: center; }
      h1 { font-size: 1.05rem; font-weight: 600; margin: 0 0 .5rem; }
      #url { font-size: .8rem; opacity: .7; word-break: break-all; user-select: all; }
      a { display: inline-block; margin-top: 1.25rem; font-size: .85rem; }
      p.hint { font-size: .75rem; opacity: .55; margin-top: 1.5rem; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Restored tab</h1>
      <div id="url"></div>
      <a id="open" href="#">Open now</a>
      <p class="hint">This tab loads when you switch to it.</p>
    </main>
    <script type="module" src="restore.js"></script>
  </body>
</html>
